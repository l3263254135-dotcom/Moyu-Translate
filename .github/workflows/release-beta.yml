name: Release Beta

on:
  push:
    tags: ["v0.2.0-beta*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: moyu-beta-release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: swift test
      - run: pnpm --filter @moyu/desktop tauri build --target universal-apple-darwin --bundles dmg
      - name: Stage macOS assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          cd release-assets
          for file in *.dmg; do
            normalized="${file// /.}"
            if [[ "$file" != "$normalized" ]]; then mv "$file" "$normalized"; fi
            shasum -a 256 "$normalized" > "$normalized.sha256"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-assets/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @moyu/desktop tauri build --bundles nsis,msi
      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe,apps/desktop/src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            $normalized = $_.Name.Replace(' ', '.')
            Copy-Item $_.FullName "release-assets/$normalized"
          }
          Get-ChildItem release-assets/*.exe,release-assets/*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/*

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-assets/*

  pages:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moyu/website sync:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @moyu/website build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/dist
      - id: deployment
        uses: actions/deploy-pages@v5
